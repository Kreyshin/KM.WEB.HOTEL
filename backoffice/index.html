<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Alba — gestión hotelera. Un sistema Karma Systems." />
    <meta name="theme-color" content="#0b1220" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Playfair Display para títulos y cifras (el registro «de recepción»),
      Manrope para la interfaz. Ambas con fallback a serif/sans del sistema en
      main.css. La pareja es deliberadamente distinta de la de Restaurante
      (Fraunces + Inter): misma estructura, otra voz.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Alba</title>
    <script>
      // Se aplica el tema antes del primer pintado para evitar el destello.
      ;(function () {
        try {
          var guardado = localStorage.getItem('km.hotel.tema')
          var oscuro =
            guardado === 'oscuro' ||
            (!guardado && window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.setAttribute('data-theme', oscuro ? 'dark' : 'light')
          document.documentElement.style.backgroundColor = oscuro ? '#080d16' : '#eef1f5'
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light')
        }
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
